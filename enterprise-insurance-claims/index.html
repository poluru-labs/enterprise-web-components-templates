<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#780C28" />
    <meta
      name="description"
      content="Beacon Insurance — claims intake, adjuster assignments, policy verification, fraud flags, and settlements for Poluru Cover."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Newsreader:opsz,wght@6..72,500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Beacon · Poluru Cover</title>
    <style>
      .boot-msg,
      .boot-error {
        max-width: 40rem;
        margin: 3rem auto;
        padding: 1.25rem 1.4rem;
        border: 1px solid #e4c5cc;
        border-radius: 10px;
        background: #fff;
        color: #1c0a10;
        font-family: 'DM Sans', 'Segoe UI', sans-serif;
      }
      .boot-error pre {
        overflow: auto;
        white-space: pre-wrap;
        color: #6e4a54;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>
    <div id="app"><p class="boot-msg">Loading Beacon…</p></div>
    <script type="module">
      import('/src/main.js').catch((error) => {
        const app = document.querySelector('#app');
        const message = error?.stack || error?.message || String(error);
        if (app) {
          app.innerHTML = `<div class="boot-error"><strong>Beacon could not start</strong><pre>${message}</pre></div>`;
        }
        console.error(error);
      });
    </script>
  </body>
</html>
