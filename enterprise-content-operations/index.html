<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#E87F24" />
    <meta
      name="description"
      content="Loom Content Operations — editorial planning, approvals, localization, publishing schedules, and asset libraries for Fieldline Press."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Loom · Fieldline Press</title>
    <style>
      .boot-msg,
      .boot-error {
        max-width: 40rem;
        margin: 3rem auto;
        padding: 1.25rem 1.4rem;
        border: 1px solid #ead4c0;
        border-radius: 10px;
        background: #fff;
        color: #2a1d12;
        font-family: 'Work Sans', 'Segoe UI', sans-serif;
      }
      .boot-error pre {
        overflow: auto;
        white-space: pre-wrap;
        color: #7a5e48;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>
    <div id="app"><p class="boot-msg">Loading Loom…</p></div>
    <script type="module">
      import('/src/main.js').catch((error) => {
        const app = document.querySelector('#app');
        const message = error?.stack || error?.message || String(error);
        if (app) {
          app.innerHTML = `<div class="boot-error"><strong>Loom could not start</strong><pre>${message}</pre></div>`;
        }
        console.error(error);
      });
    </script>
  </body>
</html>
