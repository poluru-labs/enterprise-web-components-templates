<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#C08552" />
    <meta
      name="description"
      content="Aegis — policy management, regulatory controls, audit readiness, and compliance tasks for Poluru Trust."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>Aegis · Poluru Trust</title>
    <style>
      .boot-msg,
      .boot-error {
        max-width: 40rem;
        margin: 3rem auto;
        padding: 1.25rem 1.4rem;
        border: 1px solid #e6d4c2;
        border-radius: 10px;
        background: #fff;
        color: #3a2718;
        font-family: 'Open Sans', 'Segoe UI', sans-serif;
      }
      .boot-error pre {
        overflow: auto;
        white-space: pre-wrap;
        color: #8a6f58;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>
    <div id="app"><p class="boot-msg">Loading Aegis…</p></div>
    <script type="module">
      import('/src/main.js').catch((error) => {
        const app = document.querySelector('#app');
        const message = error?.stack || error?.message || String(error);
        if (app) {
          app.innerHTML = `<div class="boot-error"><strong>Aegis could not start</strong><pre>${message}</pre></div>`;
        }
        console.error(error);
      });
    </script>
  </body>
</html>
